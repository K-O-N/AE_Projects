snapshots:
  - name: order_status_snapshots
    relation: ref('stg_ecomm__order_items')
    description:  order status snapshot table 
    config:
      schema: snapshots
      alias: string
      strategy: check
      unique_key: id
      check_cols: ['id', 'order_id', 'order_status'] 
      dbt_valid_to_current: "cast('9999-12-31' as timestamp)"
      hard_deletes: ignore 